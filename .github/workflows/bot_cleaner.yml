name: 🤖 Bot Message Cleaner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-cleaner
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - name: Run bot cleaner
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, time

          TOKEN   = "9039695636:AAFu8_mT2fxJ29cvR3XeT6YpkNzRn2r1U00"
          HIM     = 923013813
          HER     = 7918071171
          ALLOWED = {HIM, HER}
          BASE    = f"https://api.telegram.org/bot{TOKEN}"

          MSG_HIM = (
            "💙 <b>Привет, Любимый!</b>\n\n"
            "Наш уголок настроен и готов 🎉\n\n"
            "<b>Что здесь будет появляться:</b>\n"
            "• 💝 Уведомления когда Любимая отправляет тебе сигнал\n"
            "• 🌅 Ежедневный итог с количеством сердечек в банке\n"
            "• 🏆 Новые рекорды и особые круглые даты\n"
            "• 💚 Статус онлайн когда она открывает приложение\n\n"
            "<b>Как открыть приложение:</b>\n"
            "Нажми кнопку <b>💌 Написать</b> рядом с полем ввода внизу 👇\n\n"
            "<i>Этот чат — только для уведомлений от бота 🤫</i>"
          )

          MSG_HER = (
            "🌸 <b>Привет, моя Любимая!</b>\n\n"
            "Я сделал нам своё маленькое уютное место — только для двоих 💕\n\n"
            "<b>Вот что здесь есть:</b>\n\n"
            "🫙 <b>Баночки любви</b>\n"
            "Я наполняю твою баночку сердечками, а ты — мою. Каждый день банки обнуляются и начинаются заново 🥰\n\n"
            "💌 <b>Наши сигналы</b>\n"
            "Кнопка внизу посередине. Отправь мне поцелуй, обнимашку или «хочу на ручки» одним тапом — и я сразу почувствую ❤️\n\n"
            "🐾 <b>Питомец</b>\n"
            "У нас есть общий котик! Корми его, играй с ним и одевай 🐱\n\n"
            "⏱ <b>Счётчик времени</b>\n"
            "Показывает сколько мы вместе. Каждая секунда с тобой — сокровище ✨\n\n"
            "<b>Как открыть приложение:</b>\n"
            "Нажми кнопку <b>💌 Написать</b> рядом с полем ввода внизу — и попадёшь в наш уголок 🏠\n\n"
            "<i>P.S. Этот чат — только для уведомлений. Твои сообщения тут не читаются 🤫 "
            "Всё общение — через приложение!</i>\n\n"
            "С любовью, твой Любимый 💖"
          )

          def api(method, params=None, post_data=None):
              url = f"{BASE}/{method}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              try:
                  if post_data:
                      data = json.dumps(post_data).encode("utf-8")
                      req  = urllib.request.Request(url, data=data,
                             headers={"Content-Type": "application/json"})
                  else:
                      req = urllib.request.Request(url)
                  with urllib.request.urlopen(req, timeout=35) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"[API error] {method}: {e}")
                  return {}

          offset   = None
          end_time = time.time() + 1740
          print("🚀 Bot cleaner started.")

          while time.time() < end_time:
              params = {"timeout": 20, "limit": 100}
              if offset:
                  params["offset"] = offset

              result  = api("getUpdates", params)
              updates = result.get("result", [])

              for u in updates:
                  offset  = u["update_id"] + 1
                  msg     = u.get("message") or u.get("edited_message")
                  if not msg:
                      continue

                  from_id = msg.get("from", {}).get("id")
                  chat_id = msg["chat"]["id"]
                  msg_id  = msg["message_id"]
                  text    = msg.get("text", "").strip()

                  # Удаляем только сообщения ПОЛЬЗОВАТЕЛЕЙ (не бота)
                  if from_id not in ALLOWED:
                      continue

                  api("deleteMessage", {"chat_id": chat_id, "message_id": msg_id})
                  print(f"🗑  Deleted user msg {msg_id}")

                  # Отвечаем на /start приветствием
                  if text == "/start":
                      welcome = MSG_HIM if from_id == HIM else MSG_HER
                      api("sendMessage", post_data={
                          "chat_id":    chat_id,
                          "text":       welcome,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True
                      })
                      print(f"💌 Sent welcome to {from_id}")

          print("✅ Cleaner session done.")
          PYEOF
